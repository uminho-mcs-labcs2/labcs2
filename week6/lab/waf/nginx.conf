# ---------------------------------------------------------------------------
# E2 — "Virtual patching" with a reverse proxy (nginx) in front of 'vuln'.
#
# A web application firewall (WAF) is a filter that inspects incoming web (HTTP)
# requests and can block ones that look malicious. "Virtual patching" means using
# such a filter to block exploitation of a specific flaw WITHOUT changing the
# vulnerable software itself. A "reverse proxy" is a server that receives requests
# and forwards them on to another service (here, to 'vuln').
#
# LEARNING GOAL: understand how a team buys time in the first hours of an incident
# when "there is no complete mitigation" and the patch cannot be applied yet. This
# is NOT a production rule for PHP2Shell — it is SCAFFOLDING for the discussion
# about what a WAF rule can and CANNOT do.
#
# This configuration is an intentionally incomplete STARTING POINT: it is up to the
# students to justify it, improve it, and above all discuss its limits (see
# lab/README.md).
# ---------------------------------------------------------------------------

# Simple rate limiting — slows repeated probing. It does not shorten the exposure
# window or prevent a single request from reaching a vulnerable PHP code path.
limit_req_zone $binary_remote_addr zone=php2shell:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Surface reduction: do not reveal the PHP version in responses.
    # (Discussion: this delays fingerprinting, but does NOT protect — not a mitigation.)
    proxy_hide_header X-Powered-By;

    location / {
        limit_req zone=php2shell burst=20 nodelay;

        # ---- Illustrative blocking rule ----------------------------------
        # Example of a representative "signature": a marker we use in the E2
        # tests to verify the block works. In production, real rules (e.g.,
        # Cloudflare managed rules) target specific vectors — here we practice
        # the MECHANICS, not the real vector.
        if ($http_x_lab_attack = "php2shell-demo") {
            return 403;
        }
        # ------------------------------------------------------------------

        proxy_pass http://vuln:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
